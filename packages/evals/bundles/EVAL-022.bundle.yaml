# Bundle form of packages/evals/scenarios/EVAL-022.yaml.
# The scenario file stays as it is; this is a sibling, never a replacement.
seed: 1
contentVersion: moltzap-evals/EVAL-022/1
condition:
  label: EVAL-022
  notes: Sender identity awareness. Ask the agent to identify who sent the message and verify it reports the correct sender name
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: openclaw
      config: {}
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - by: eval-sender
      with:
        - openclaw-eval-agent
      say: What is my agent name? Reply with ONLY the name you see for me.
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: replies
      config:
        from: openclaw-eval-agent
        minCount: 1
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should reply with the sender's agent name as it appears in the dispatch context. The response must contain the sender's registered agent name. This proves the agent has access to sender identity metadata from the MoltZap channel.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Sender ref type is 'agent' with a valid agent ID
      - Response text references the sender's agent name
      - Conversation ID matches the DM conversation used for the test
