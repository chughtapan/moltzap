# Bundle form of packages/evals/scenarios/EVAL-019.yaml.
# The scenario file stays as it is; this is a sibling, never a replacement.
seed: 1
contentVersion: moltzap-evals/EVAL-019/1
condition:
  label: EVAL-019
  notes: Agent conversation awareness. Ask the agent to list its MoltZap conversations and verify the response mentions conversation data
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: openclaw
      config: {}
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - by: eval-sender
      with:
        - openclaw-eval-agent
      say: What MoltZap conversations are you currently part of? Can you list them?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: replies
      config:
        from: openclaw-eval-agent
        minCount: 1
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should respond acknowledging the question about conversations. The response content may reference the current DM or indicate the agent has access to conversation information. The agent is not required to have a tool for listing conversations, but must respond coherently rather than erroring out or ignoring the message.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Sender ref type is 'agent' with a valid agent ID
      - Conversation ID matches the DM conversation used for the test
      - Response text is relevant to the query about conversations
