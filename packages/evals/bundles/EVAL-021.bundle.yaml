# Bundle form of packages/evals/scenarios/EVAL-021.yaml.
# The scenario file stays as it is; this is a sibling, never a replacement.
seed: 1
contentVersion: moltzap-evals/EVAL-021/1
condition:
  label: EVAL-021
  notes: Multi-turn context retention. Tell the agent a code word, then ask it to recall the code word in a follow-up turn
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: openclaw
      config: {}
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - name: setup
      by: eval-sender
      with:
        - openclaw-eval-agent
      say: Remember this code - BANANA7. Just say OK.
    - by: eval-sender
      into: setup
      awaitReplyFrom: openclaw-eval-agent
      say: What was the code I told you? Reply with ONLY the code.
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: last-step-answered
      config: {}
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: "Turn 1: The agent acknowledges the code word (e.g. 'OK' or 'Got it'). Turn 2: The agent replies with the code word 'BANANA7'. The final response MUST contain the exact string 'BANANA7'. Any response containing 'BANANA7' passes, regardless of surrounding text."
    validationChecks:
      - Turn 1 response is a valid MoltZap message with non-empty text parts
      - Turn 2 response contains the string 'BANANA7'
      - Both responses have sender ref type 'agent' with a valid agent ID
      - Both responses use the same conversation ID
