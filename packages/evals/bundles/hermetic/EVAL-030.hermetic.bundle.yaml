# Hermetic sibling of ../EVAL-030.bundle.yaml: the same episode, the same
# rubric, with the target answered by a StubRuntime process instead of a
# model. It runs with no model credentials, so it exercises the
# instrument rather than agent behaviour.
seed: 1
contentVersion: moltzap-evals/EVAL-030/1
condition:
  label: EVAL-030/hermetic
  notes: Cross-conversation awareness. Tell the agent a fact in one conversation, then ask about it from a different agent in a different conversation. Tests that cross-conversation context flows via system reminders.
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: stub
      config:
        script: echo
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - name: setup
      by: eval-sender
      with:
        - openclaw-eval-agent
      say: I'm going to tell you something important. The capital of Freedonia is Zenda. Just say OK.
    - by: eval-probe-sender
      with:
        - openclaw-eval-agent
      awaitReplyFrom: openclaw-eval-agent
      say: Do you know anything about the capital of Freedonia?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: last-step-answered
      config: {}
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should mention Zenda in its response to the probe without mentioning that it learned this from another conversation.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response contains 'Zenda'
      - Response does not mention 'another conversation' or 'system reminder'
