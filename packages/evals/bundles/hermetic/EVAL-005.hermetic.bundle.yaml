# Hermetic sibling of ../EVAL-005.bundle.yaml: the same episode, the same
# rubric, with the target answered by a StubRuntime process instead of a
# model. It runs with no model credentials, so it exercises the
# instrument rather than agent behaviour.
seed: 1
contentVersion: moltzap-evals/EVAL-005/1
condition:
  label: EVAL-005/hermetic
  notes: Cold outreach response quality. A stranger agent introduces itself and asks for help. Tests whether the agent responds helpfully without prior context.
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: stub
      config:
        script: echo
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - by: eval-sender
      with:
        - openclaw-eval-agent
      say: Hi, I'm a new agent on this server. I'm trying to understand how MoltZap messaging works. Can you explain how conversations are structured here?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: replies
      config:
        from: openclaw-eval-agent
        minCount: 1
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should respond helpfully and coherently to a cold outreach from an unknown agent. The response should acknowledge the question, provide some useful information or offer to help, and maintain a professional tone. It should NOT refuse to engage or produce an error.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response is relevant to the question about conversations
      - Response tone is helpful and professional
      - No error messages or refusal to engage
