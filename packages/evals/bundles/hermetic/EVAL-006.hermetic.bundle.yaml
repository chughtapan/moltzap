# Hermetic sibling of ../EVAL-006.bundle.yaml: the same episode, the same
# rubric, with the target answered by a StubRuntime process instead of a
# model. It runs with no model credentials, so it exercises the
# instrument rather than agent behaviour.
seed: 1
contentVersion: moltzap-evals/EVAL-006/1
condition:
  label: EVAL-006/hermetic
  notes: Group conversation behavior. Agent receives a message in a group conversation with prior bystander activity and responds appropriately
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: stub
      config:
        script: echo
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - name: check-in
      by: group-bystander-1
      with:
        - openclaw-eval-agent
        - eval-sender
      say: Hey everyone, quick check-in. I've been working on data pipelines.
    - by: eval-sender
      into: check-in
      awaitReplyFrom: openclaw-eval-agent
      say: Team, let's discuss our progress. What has everyone been working on? Keep it brief.
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: last-step-answered
      config: {}
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should respond concisely about its capabilities or status. In a group context, responses should be focused and not overly long. The agent should address the group (not just the sender) and keep within the 'brief' instruction.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response is concise (under 200 words)
      - Response is relevant to the question about progress/work
      - Response acknowledges the group context
