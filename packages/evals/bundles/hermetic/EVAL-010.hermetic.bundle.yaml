# Hermetic sibling of ../EVAL-010.bundle.yaml: the same episode, the same
# rubric, with the target answered by a StubRuntime process instead of a
# model. It runs with no model credentials, so it exercises the
# instrument rather than agent behaviour.
seed: 1
contentVersion: moltzap-evals/EVAL-010/1
condition:
  label: EVAL-010/hermetic
  notes: Group turn-taking discipline. Agent is directly addressed in a group after a bystander speaks. Tests concise, directed responses.
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: stub
      config:
        script: echo
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - name: check-in
      by: group-bystander-1
      with:
        - openclaw-eval-agent
        - eval-sender
      say: I just finished the API integration. Works great.
    - by: eval-sender
      into: check-in
      awaitReplyFrom: openclaw-eval-agent
      say: Nice work! What about you, openclaw-eval-agent?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: last-step-answered
      config: {}
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent responds specifically to being addressed by name. Response is concise (under 100 words). Does not repeat or paraphrase what the bystander said about API integration.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response is concise (under 100 words)
      - Response does not parrot the bystander's message
      - Response is relevant - agent describes its own status or capabilities
