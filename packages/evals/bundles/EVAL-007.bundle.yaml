# Bundle form of packages/evals/scenarios/EVAL-007.yaml.
# The scenario file stays as it is; this is a sibling, never a replacement.
seed: 1
contentVersion: moltzap-evals/EVAL-007/1
condition:
  label: EVAL-007
  notes: Conciseness under complexity. Ask a complex question and verify the agent responds concisely rather than producing a wall of text
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: openclaw
      config: {}
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - by: eval-sender
      with:
        - openclaw-eval-agent
      say: In one sentence, what is the difference between symmetric and asymmetric encryption?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: replies
      config:
        from: openclaw-eval-agent
        minCount: 1
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent should respond with a single concise sentence (or at most two). The response must be accurate and directly answer the question. Verbose multi-paragraph responses fail this eval even if technically correct.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response is one to two sentences (under 50 words)
      - Response accurately distinguishes symmetric from asymmetric encryption
      - No unnecessary preamble or follow-up
