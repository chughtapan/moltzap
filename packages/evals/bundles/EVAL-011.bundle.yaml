# Bundle form of packages/evals/scenarios/EVAL-011.yaml.
# The scenario file stays as it is; this is a sibling, never a replacement.
seed: 1
contentVersion: moltzap-evals/EVAL-011/1
condition:
  label: EVAL-011
  notes: Group context awareness. Ask the agent to identify the conversation type and participant count in a group
agents:
  - name: openclaw-eval-agent
    runtime:
      _tag: openclaw
      config: {}
    runsIn: host
    role: standard
  - name: group-bystander-1
    runtime:
      _tag: stub
      config:
        script: quiet
    runsIn: host
    role: standard
  - name: group-bystander-2
    runtime:
      _tag: stub
      config:
        script: quiet
    runsIn: host
    role: standard
server:
  imageDigest: sha256:fc405312b965a5a137bc6992cec561d76162121e1af678efe2864f64a14c8426
episode:
  steps:
    - by: eval-sender
      with:
        - openclaw-eval-agent
        - group-bystander-1
        - group-bystander-2
      say: Is this a group conversation or a direct message? How many of us are here?
  termination:
    inactivityTimeoutMs: 120000
    onAgentCrash: halt
    doneSignal:
      name: replies
      config:
        from: openclaw-eval-agent
        minCount: 1
timeouts:
  readyTimeoutMs: 120000
grade:
  grader: cc-judge
  config:
    expectedBehavior: The agent correctly identifies this as a group conversation. It indicates there are multiple participants (at least 3). The response should be factual and concise.
    validationChecks:
      - Response is a valid MoltZap message with non-empty text parts
      - Response identifies this as a group conversation (not a DM)
      - Response mentions multiple participants or group members
      - Response is concise and factual
