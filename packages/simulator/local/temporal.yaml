apiVersion: v1
kind: Namespace
metadata:
  name: moltzap-system
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: moltzap-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
      nodePort: 30733
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: moltzap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: temporal
          image: temporalio/temporal:1.8.2@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e
          args:
            - server
            - start-dev
            - --ip
            - 0.0.0.0
            - --headless
            - --db-filename
            - /var/lib/temporal/temporal.db
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/temporal
      volumes:
        - name: state
          emptyDir: {}
