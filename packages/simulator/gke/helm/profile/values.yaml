clusterQueue:
  name: moltzap

resourceFlavor:
  name: moltzap-gke-agents

agentPool:
  label:
    key: moltzap.dev/pool
    value: agents
  taint:
    key: moltzap.dev/agents
    value: "true"
    effect: NoSchedule

# Held below one e2-standard-16's measured allocatable capacity (15890m cpu,
# 57Gi memory, 43Gi ephemeral storage), not its advertised size. Sized with
# agent_max_nodes; see the profile README.
quota:
  cpu: "15"
  memory: 52Gi
  ephemeralStorage: 36Gi
