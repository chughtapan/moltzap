name: Set up the toolchain
description: >-
  Install pnpm at the package.json `packageManager` version and Node.js at the
  `.node-version` version, with the pnpm store cached. Every workflow job sets
  up the toolchain here, so each action version is written once.
inputs:
  registry-url:
    description: Registry that setup-node writes an .npmrc for; empty writes none.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
