name: Publish to npm

# One release publishes six packages at one calendar version, pushes the three
# simulator images tagged with that version, and records the image digests
# beside the version in one release commit. The trigger is manual: the first
# release proves the npm trusted publishers, the Workload Identity provider,
# and the release App before any push-triggered variant is considered.
#
# A rerun after a partial failure converges rather than minting a second
# release: the version is recomputed from npm (unchanged while nothing is
# published at it), an image whose tag already exists is reused by digest, a
# head that is already the release commit skips the bump, and every package
# already on npm at that version is skipped.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  RELEASE_PACKAGES: identity router client openclaw-channel nanoclaw-channel simulator
  # The Terraform `controller_repository` output of packages/simulator/gke.
  IMAGE_REPOSITORY: us-central1-docker.pkg.dev/agentic-societies/moltzap-simulator

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The App token on checkout makes the release push use it. Full history
      # is needed to find the previous release commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Decide whether this run bumps or resumes a release
        id: plan
        run: |
          HEAD_SUBJECT=$(git log -1 --format=%s)
          if [[ "$HEAD_SUBJECT" == "chore(release): moltzap@"* ]]; then
            # A previous run committed the release and failed later; publish it.
            VERSION=${HEAD_SUBJECT#chore(release): moltzap@}
            echo "Resuming release $VERSION from the head release commit"
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE=$(git log --grep="^chore(release): moltzap@" --format="%H" -1 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            AFFECTED=$(pnpm exec nx show projects --affected --withTarget=build --base="$BASE" --head=HEAD --json)
            echo "Affected build projects since $BASE: $AFFECTED"
            RELEASE=0
            for pkg in $RELEASE_PACKAGES; do
              NAME=$(jq -r .name "packages/$pkg/package.json")
              if jq -e --arg project "$NAME" 'index($project) != null' <<< "$AFFECTED" >/dev/null; then
                RELEASE=1
              fi
            done
            if [ "$RELEASE" -eq 0 ]; then
              echo "No published package changed since $BASE — nothing to release"
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "No previous release commit — bootstrapping the one-version set"
          fi

          VERSION=$(scripts/release/compute-next-version.sh $RELEASE_PACKAGES)
          echo "Next version: $VERSION"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the version into every published manifest
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for pkg in $RELEASE_PACKAGES; do
            jq --arg v "$VERSION" '.version = $v' "packages/$pkg/package.json" > tmp.json
            mv tmp.json "packages/$pkg/package.json"
          done
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build all packages
        if: steps.plan.outputs.mode != 'skip'
        run: pnpm build

      # Every published package declares test:pack (a boundary-check floor),
      # so run-many cannot silently skip one. The gates install into private
      # temporary directories, but each spawns pnpm and the OpenClaw host, so
      # they run one at a time.
      - name: Verify the published closure installs from tarballs
        if: steps.plan.outputs.mode != 'skip'
        run: pnpm nx run-many -t test:pack --parallel=1

      - uses: google-github-actions/auth@v2
        if: steps.plan.outputs.mode == 'bump'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.plan.outputs.mode == 'bump'

      - name: Push the release images or reuse their existing digests
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gcloud auth configure-docker "${IMAGE_REPOSITORY%%/*}" --quiet
          # Docker builds are not byte-reproducible: a tag that already exists
          # was pushed by an earlier attempt at this version and is reused so
          # one release never has two digests.
          resolve_or_build() {
            local name="$1" builder="$2" repository="$IMAGE_REPOSITORY/$1" digest
            if digest=$(gcloud artifacts docker images describe "$repository:$VERSION" \
                --format='value(image_summary.digest)' 2>/dev/null) && [ -n "$digest" ]; then
              echo "reusing $repository:$VERSION@$digest" >&2
            else
              digest=$(node "$builder" --repository "$repository" --tag "$VERSION" --push \
                | tail -1 | jq -r .imageDigest)
            fi
            jq -n --arg name "$name" --arg repository "$repository" --arg digest "$digest" \
              '{name: $name, repository: $repository, digest: $digest}'
          }
          {
            resolve_or_build controller scripts/simulator/build-controller-image.mjs
            resolve_or_build openclaw-agent scripts/agent-images/build-openclaw-image.mjs
            resolve_or_build nanoclaw-agent scripts/agent-images/build-nanoclaw-image.mjs
          } | jq -s --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '{version: $version, sourceRevision: $revision, images: .}' \
            > "$RUNNER_TEMP/published-images.json"
          cat "$RUNNER_TEMP/published-images.json"

      - name: Record digests, regenerate docs, and commit the release
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/release/write-published-images.mjs \
            --digests "$RUNNER_TEMP/published-images.json"
          pnpm docs:generate
          grep -qx '## \[Unreleased\]' CHANGELOG.md || { echo "CHANGELOG.md has no [Unreleased] section"; exit 1; }
          sed -i "s/^## \[Unreleased\]$/&\n\n## [$VERSION] - $(date -u +%F)/" CHANGELOG.md

          git config user.name "moltzap-release[bot]"
          git config user.email "moltzap-release[bot]@users.noreply.github.com"
          git add packages/*/package.json pnpm-lock.yaml CHANGELOG.md \
            packages/simulator/gke/README.md docs/ 'packages/**/MODULE.md' README.md
          git commit -m "chore(release): moltzap@$VERSION"
          git push --atomic origin HEAD:main

      - name: Publish every package not yet on npm at this version
        if: steps.plan.outputs.mode != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          for pkg in $RELEASE_PACKAGES; do
            NAME=$(jq -r .name "packages/$pkg/package.json")
            VER=$(jq -r .version "packages/$pkg/package.json")
            [ "$VER" = "$VERSION" ] || { echo "ERROR: $NAME is at $VER, expected $VERSION"; exit 1; }
            if npm view "${NAME}@${VER}" version 2>/dev/null | grep -q "$VER"; then
              echo "${NAME}@${VER} already on npm — skipping"
              continue
            fi
            echo "Publishing ${NAME}@${VER}..."
            (
              cd "packages/$pkg"
              TARBALL=$(pnpm pack --pack-gzip-level 9 | tail -1)
              [ -f "$TARBALL" ] || { echo "ERROR: pack failed, tarball not found"; exit 1; }
              npm publish "$TARBALL" --access public --provenance
            )
          done
