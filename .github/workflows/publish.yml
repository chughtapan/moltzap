name: Publish to npm (deferred)

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated publishable package directories to force, e.g. 'simulator openclaw-channel'"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Publication stays disabled until the package closure, version policy,
    # and installable public artifact set have one accepted decision.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Use App token for checkout so git push uses it automatically
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v4
      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Detect changed packages and compute versions
        id: versions
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages || '' }}
        run: |
          # Find the last release commit, or use empty tree if none (bootstrap)
          BASE=$(git log --grep="^chore(release):" --format="%H" -1 2>/dev/null || true)
          if [ -z "$BASE" ]; then
            echo "No previous release commit found — bootstrapping (all publishable packages)"
            BASE=$(git hash-object -t tree /dev/null)
          fi

          AFFECTED_PROJECTS=$(pnpm exec nx show projects \
            --affected \
            --withTarget=build \
            --base="$BASE" \
            --head=HEAD \
            --json)
          echo "Affected build projects since $BASE: $AFFECTED_PROJECTS"

          CHANGED=""
          REQUESTED_PACKAGES=" ${REQUESTED_PACKAGES} "
          for pkg in simulator openclaw-channel; do
            PROJECT_NAME=$(node -p "require('./packages/$pkg/package.json').name")
            if [[ "$REQUESTED_PACKAGES" == *" $pkg "* ]]; then
              SHOULD_RELEASE=1
              echo "Package $pkg requested by workflow_dispatch input"
            elif jq -e --arg project "$PROJECT_NAME" \
              'index($project) != null' <<< "$AFFECTED_PROJECTS" >/dev/null; then
              SHOULD_RELEASE=1
            else
              SHOULD_RELEASE=0
            fi

            if [ "$SHOULD_RELEASE" -eq 1 ]; then
              VERSION=$(scripts/release/compute-next-version.sh "$pkg")
              echo "${pkg}_version=$VERSION" >> "$GITHUB_OUTPUT"
              CHANGED="$CHANGED $pkg"
              echo "Package $pkg changed — next version: $VERSION"

              # Write version to package.json
              jq --arg v "$VERSION" '.version = $v' "packages/$pkg/package.json" > tmp.json && mv tmp.json "packages/$pkg/package.json"

            else
              echo "Package $pkg — no publishable changes, skipping"
            fi
          done

          CHANGED=$(echo "$CHANGED" | xargs)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Commit and push version bump
        if: steps.versions.outputs.changed != ''
        run: |
          # Build commit message from package.json versions
          MSG="chore(release):"
          for pkg in ${{ steps.versions.outputs.changed }}; do
            PKG_JSON="./packages/$pkg/package.json"
            VER=$(node -p "require('$PKG_JSON').version")
            NAME=$(node -p "require('$PKG_JSON').name")
            MSG="$MSG ${NAME}@${VER}"
          done

          # Update lockfile with new versions (skip scripts — full build happens in next step)
          pnpm install --no-frozen-lockfile --ignore-scripts

          # Build all packages so pre-commit typecheck passes
          pnpm build

          # Regenerate generated module reference pages after package version
          # changes. Without this, the husky pre-commit drift gate
          # (`pnpm docs:generate && git diff --quiet`) detects the regen at
          # commit time and aborts with exit code 1.
          pnpm docs:generate

          git config user.name "moltzap-release[bot]"
          git config user.email "moltzap-release[bot]@users.noreply.github.com"
          git add packages/*/package.json pnpm-lock.yaml
          # Stage doc regeneration outputs so the pre-commit drift gate passes.
          # Mirrors `docs:check:drift` inputs: `docs/`, `packages/**/MODULE.md`,
          # `README.md`.
          git add docs/ 'packages/**/MODULE.md' README.md
          if git diff --cached --quiet; then
            echo "No version changes to commit — versions already up to date"
          else
            git commit -m "$MSG"
            # If push fails (race condition), bail — next run catches up
            git push --atomic origin main
          fi

      - name: Build all packages
        run: pnpm build

      - name: Verify simulator package consumers
        run: pnpm nx run @moltzap/simulator:test:pack

      - name: Verify OpenClaw package consumers
        run: pnpm nx run @moltzap/openclaw-channel:test:pack

      - name: Publish packages
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          # Publish any package whose local version is not yet on npm. This
          # covers both newly bumped versions and versions from prior runs
          # where the bump committed but the publish failed.
          for pkg in simulator openclaw-channel; do
            PKG_JSON="./packages/$pkg/package.json"
            VER=$(node -p "require('$PKG_JSON').version")
            NAME=$(node -p "require('$PKG_JSON').name")
            if npm view "${NAME}@${VER}" version 2>/dev/null | grep -q "$VER"; then
              echo "${NAME}@${VER} already on npm — skipping"
              continue
            fi
            echo "Publishing ${NAME}@${VER}..."
            (
              cd "packages/$pkg"
              TARBALL=$(pnpm pack --pack-gzip-level 9 | tail -1)
              [ -f "$TARBALL" ] || { echo "ERROR: pack failed, tarball not found"; exit 1; }
              npm publish "$TARBALL" --access public --provenance
            )
          done
