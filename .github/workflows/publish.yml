name: Publish to npm

# One release computes one calendar version and publishes, at that version,
# only the packages whose packed content changed since the version their
# manifest names: `scripts/release/select-packages.ts` compares each
# package's content hash with the `sharnessContentHash` npm recorded for that
# version. A dependent of a selected package is selected too, because its
# packed manifest pins the sibling's new version, so every published package
# pins its siblings to their newest published versions. Each published
# manifest records its own content hash; the OpenClaw channel's also records
# `sharnessHostCodeHash` (`scripts/release/host-code-hash.ts`), the hash of the
# code OpenClaw loads for it. The release commit records every manifest. The trigger is manual: the first release proves the npm
# trusted publishers and the release App before any push-triggered variant is
# considered.
#
# A rerun after a partial failure converges rather than minting a second
# release. Before the release commit exists, the version is recomputed from
# npm and the release tags (unchanged while nothing is published at it and
# the UTC day has not turned). Once the release commit is on main, any run
# finds it, checks out its tree, and publishes whatever manifest version
# there npm still lacks, however many commits landed since. A release that
# can never complete is left behind by dispatching with `start_new_version`,
# which mints the next version from the tip instead.
on:
  workflow_dispatch:
    inputs:
      start_new_version:
        description: >-
          Abandon an incomplete release commit on main instead of resuming it
          and mint the next version from the tip. Deprecate by hand whatever
          the abandoned version did publish.
        type: boolean
        default: false

# Two releases must never interleave: both would compute the same version from
# the same npm state and race to push its release commit and tag.
concurrency:
  group: publish
  cancel-in-progress: false

# The push to main uses the release App token; the workflow token only needs
# to read the repository and mint the OIDC token npm verifies.
permissions:
  contents: read
  id-token: write

# `bash` here means `bash -eo pipefail`, so a command that fails inside a
# pipeline fails its step instead of handing a partial result to the next.
defaults:
  run:
    shell: bash

# Dependency order: each package comes after the siblings it depends on, which
# the selection checks.
env:
  RELEASE_PACKAGES: identity router client openclaw-channel

jobs:
  publish:
    # Only main releases. A dispatch may name any branch, and this job pushes
    # with the release App token, so an unreviewed branch must not reach here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment is where required reviewers for a release live; GitHub
    # creates it on first use, and the maintainer can add reviewers there.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history: the plan step looks for the last release commit.
      # Credentials are not persisted, so nothing that runs before the push
      # (installs, builds, the pack gates' consumer installs) holds a token
      # that can write to main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: ./.github/actions/setup-toolchain
        with:
          registry-url: https://registry.npmjs.org

      # The last release commit on main decides whether this run resumes it:
      # a manifest version there that npm still lacks is published from that
      # commit's own tree. Otherwise the run releases the dispatched commit,
      # which must still be the tip of main so that the release commit and
      # npm's provenance describe one tree.
      - name: Decide whether this run bumps or resumes a release
        id: plan
        env:
          START_NEW_VERSION: ${{ inputs.start_new_version }}
        run: |
          git fetch origin main --quiet
          RELEASE_LINE=$(git log origin/main --format='%H %s' | grep -m1 ' chore(release): moltzap@' || true)
          if [ -n "$RELEASE_LINE" ]; then
            RELEASE_COMMIT=${RELEASE_LINE%% *}
            VERSION=${RELEASE_LINE#* chore(release): moltzap@}
            [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
              echo "ERROR: release commit $RELEASE_COMMIT has an unreadable version '$VERSION'"
              exit 1
            }
            MISSING=""
            for pkg in $RELEASE_PACKAGES; do
              MANIFEST=$(git show "$RELEASE_COMMIT:packages/$pkg/package.json" 2>/dev/null) || continue
              NAME=$(jq -r .name <<<"$MANIFEST")
              VER=$(jq -r .version <<<"$MANIFEST")
              STATUS=0
              scripts/release/npm-version-exists.sh "${NAME}@${VER}" || STATUS=$?
              case $STATUS in
                0) ;;
                1) MISSING="$MISSING $pkg" ;;
                *) exit "$STATUS" ;;
              esac
            done
            MISSING=${MISSING# }
            if [ -n "$MISSING" ] && [ "$START_NEW_VERSION" = "true" ]; then
              echo "Abandoning release $VERSION from $RELEASE_COMMIT; not yet on npm: $MISSING"
            elif [ -n "$MISSING" ]; then
              echo "Resuming release $VERSION from $RELEASE_COMMIT; not yet on npm: $MISSING"
              git checkout --quiet "$RELEASE_COMMIT"
              {
                echo "mode=resume"
                echo "version=$VERSION"
                echo "packages=$MISSING"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || {
            echo "ERROR: main moved past the dispatched commit $GITHUB_SHA; dispatch the release again from the tip"
            exit 1
          }
          # A version whose release commit and tag were pushed but whose
          # publish never completed is taken even though npm has never seen it.
          TAKEN_VERSIONS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')
          export TAKEN_VERSIONS
          VERSION=$(scripts/release/compute-next-version.sh $RELEASE_PACKAGES)
          echo "Next version: $VERSION"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      # Package versions are never compiled into `dist`, so the build does not
      # depend on which packages the selection later moves to the version.
      - name: Build all packages
        run: pnpm build

      # Recorded before the content hash, so the hash covers it. The value is
      # written under both keys so mixed-release gates from before
      # `sharnessWireVersion` still read it.
      - name: Record emitted wire version in published Identity metadata
        working-directory: packages/identity
        run: |
          WIRE_VERSION=$(node --input-type=module -e 'import { WIRE_VERSION } from "@moltzap/identity"; console.log(WIRE_VERSION)')
          jq --arg v "$WIRE_VERSION" '.sharnessWireVersion = $v | .moltzapWireVersion = $v' package.json > tmp.json
          mv tmp.json package.json

      # A bump selects the changed packages and writes the version and content
      # hash into their manifests. A resume rebuilt the release commit's tree,
      # so each package it still owes must hash to the value that commit
      # recorded; a mismatch means the rebuild would publish other code than
      # the release commit describes. The example pins each @moltzap package
      # it installs from npm to that package's manifest version, so a checkout
      # of the release tag runs what that tag published.
      - name: Choose the packages this run publishes
        id: select
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          VERSION: ${{ steps.plan.outputs.version }}
          RESUME_PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          if [ "$MODE" = "resume" ]; then
            for pkg in $RESUME_PACKAGES; do
              RECORDED=$(jq -r '.sharnessContentHash // ""' "packages/$pkg/package.json")
              ACTUAL=$(node scripts/release/content-hash.ts "$pkg")
              [ "$RECORDED" = "$ACTUAL" ] || {
                echo "ERROR: packages/$pkg rebuilt to $ACTUAL, but the release commit recorded '$RECORDED'"
                exit 1
              }
            done
            echo "packages=$RESUME_PACKAGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SELECTED=$(node scripts/release/select-packages.ts "$VERSION" $RELEASE_PACKAGES)
          if [ -z "$SELECTED" ]; then
            echo "No package changed since the version its manifest names; nothing to release."
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $VERSION for: $SELECTED"
          if [[ " $SELECTED " == *" openclaw-channel "* ]]; then
            HOST_CODE_HASH=$(node scripts/release/host-code-hash.ts openclaw-channel)
            jq --arg h "$HOST_CODE_HASH" '.sharnessHostCodeHash = $h' \
              packages/openclaw-channel/package.json > tmp.json
            mv tmp.json packages/openclaw-channel/package.json
          fi
          PINS='{}'
          for pkg in $RELEASE_PACKAGES; do
            PINS=$(jq --argjson pins "$PINS" '$pins + {(.name): .version}' "packages/$pkg/package.json")
          done
          jq --argjson pins "$PINS" \
            '.dependencies |= with_entries(if (.key | startswith("@moltzap/")) then .value = $pins[.key] else . end)' \
            examples/two-agents/package.json > tmp.json
          mv tmp.json examples/two-agents/package.json
          pnpm install --no-frozen-lockfile --ignore-scripts
          echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"

      # The gates pack the four published packages and the NanoClaw adapter,
      # whose gate proves it still compiles against the Client ABI in isolation
      # (deployment's image build copies its source, not a tarball); identity and router
      # travel in every closure, and each gate is a boundary-check floor, so
      # run-many cannot silently skip one; the gates spawn pnpm and the
      # OpenClaw host, so they run one at a time.
      - name: Verify the published closure installs from tarballs
        if: steps.select.outputs.packages != ''
        run: pnpm nx run-many -t test:pack --parallel=1

      # The release App token is minted only now, scoped to contents, and
      # used for exactly one push.
      - uses: actions/create-github-app-token@v3
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The runner's pnpm install wired the husky hooks; the release commit
      # is made of generated output CI already gated, so the hooks stay out.
      # towncrier writes the version's CHANGELOG.md section from the fragments
      # in changelog.d/ and deletes them; with no fragments it writes nothing.
      # A rerun whose section is already written skips it. Without its marker
      # line towncrier would write above the file's title, so a missing marker
      # fails the release. This job can push to main and mint the npm OIDC
      # token, so towncrier and its dependencies install only from hash-pinned
      # requirements.
      - name: Regenerate docs and commit the release
        if: steps.plan.outputs.mode == 'bump' && steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          HUSKY: "0"
        run: |
          pnpm docs:generate
          # The CHANGELOG preamble predates per-package versions; this rewrite
          # finds nothing to replace once a release commit has corrected it.
          # shellcheck disable=SC2016 # The backticks are Markdown, not a substitution.
          node -e '
            const fs = require("node:fs");
            const before = "Every published package\ncarries the same version in a release, and the release commit writes each\nsection below from the fragments in `changelog.d/`.";
            const after = "A release publishes at\nits version only the packages that changed since their last published version;\nthe release commit lists them and writes each section below from the fragments\nin `changelog.d/`.";
            fs.writeFileSync("CHANGELOG.md", fs.readFileSync("CHANGELOG.md", "utf8").replace(before, after));
          '
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            grep -qxF '<!-- towncrier release notes start -->' CHANGELOG.md \
              || { echo "CHANGELOG.md lost its towncrier marker"; exit 1; }
            python3 -m venv "$RUNNER_TEMP/towncrier"
            "$RUNNER_TEMP/towncrier/bin/pip" install --quiet --require-hashes --no-deps \
              -r scripts/release/towncrier-requirements.txt
            "$RUNNER_TEMP/towncrier/bin/towncrier" build \
              --version "$VERSION" --date "$(date -u +%F)" --yes
          fi

          git config user.name "moltzap-release[bot]"
          git config user.email "moltzap-release[bot]@users.noreply.github.com"
          git add packages/*/package.json examples/two-agents/package.json \
            pnpm-lock.yaml CHANGELOG.md changelog.d/ \
            docs/ 'packages/**/MODULE.md' README.md
          PUBLISHED=""
          for pkg in $PACKAGES; do
            PUBLISHED="$PUBLISHED$(jq -r '"- \(.name)@\(.version)"' "packages/$pkg/package.json")"$'\n'
          done
          git commit -m "chore(release): moltzap@$VERSION" -m "Publishes:"$'\n'"$PUBLISHED"
          git tag "v$VERSION"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)" \
            push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish every selected package not yet on npm at this version
        if: steps.select.outputs.packages != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.select.outputs.packages }}
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          # Every selected manifest is checked before the first publish, so a
          # drifted one cannot leave the release half-published.
          for pkg in $PACKAGES; do
            VER=$(jq -r .version "packages/$pkg/package.json")
            [ "$VER" = "$VERSION" ] || { echo "ERROR: packages/$pkg is at $VER, expected $VERSION"; exit 1; }
          done
          for pkg in $PACKAGES; do
            NAME=$(jq -r .name "packages/$pkg/package.json")
            VER=$VERSION
            STATUS=0
            scripts/release/npm-version-exists.sh "${NAME}@${VER}" || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "${NAME}@${VER} already on npm — skipping"
              continue
            fi
            [ "$STATUS" -eq 1 ] || exit "$STATUS"
            echo "Publishing ${NAME}@${VER}..."
            (
              cd "packages/$pkg"
              TARBALL=$(pnpm pack --pack-gzip-level 9 | tail -1)
              [ -f "$TARBALL" ] || { echo "ERROR: pack failed, tarball not found"; exit 1; }
              npm publish "$TARBALL" --access public --provenance
            )
          done
