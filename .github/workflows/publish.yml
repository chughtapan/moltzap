name: Publish to npm

# One release publishes five packages at one calendar version, pushes the three
# simulator images tagged with that version, and records the image digests
# beside the version in one release commit. The trigger is manual: the first
# release proves the npm trusted publishers, the Workload Identity provider,
# and the release App before any push-triggered variant is considered.
#
# A rerun after a partial failure converges rather than minting a second
# release. Before the release commit exists, the version is recomputed from
# npm and the release tags (unchanged while nothing is published at it and
# the UTC day has not turned) and an image an earlier attempt pushed for that
# version from the same revision is reused by digest. Once the release commit
# is on main, any run finds it, checks out its tree, and publishes whatever
# that version still lacks on npm, however many commits landed since. A
# release that can never complete is left behind by dispatching with
# `start_new_version`, which mints the next version from the tip instead.
on:
  workflow_dispatch:
    inputs:
      start_new_version:
        description: >-
          Abandon an incomplete release commit on main instead of resuming it
          and mint the next version from the tip. Deprecate by hand whatever
          the abandoned version did publish.
        type: boolean
        default: false

# Two releases must never interleave: both would compute the same version and
# push different builds to the same image tags before either commits.
concurrency:
  group: publish
  cancel-in-progress: false

# The push to main uses the release App token; the workflow token only needs
# to read the repository and mint the OIDC token npm and Google verify.
permissions:
  contents: read
  id-token: write

# `bash` here means `bash -eo pipefail`, so a builder that fails inside a
# pipeline fails its step instead of handing a partial result to the next.
defaults:
  run:
    shell: bash

env:
  RELEASE_PACKAGES: identity router client openclaw-channel simulator
  # The Terraform `controller_repository` output of packages/simulator/gke,
  # copied into a repository variable next to the Workload Identity ones.
  IMAGE_REPOSITORY: ${{ vars.GCP_IMAGE_REPOSITORY }}

jobs:
  publish:
    # Only main releases. A dispatch may name any branch, and this job pushes
    # with the release App token, so an unreviewed branch must not reach here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment is where required reviewers for a release live; GitHub
    # creates it on first use, and the maintainer can add reviewers there.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history: the plan step looks for the last release commit.
      # Credentials are not persisted, so nothing that runs before the push
      # (installs, builds, the pack gates' consumer installs) holds a token
      # that can write to main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      # The repository Node pin ships npm >=11.5 for OIDC trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The last release commit on main decides whether this run resumes it:
      # a version some package still lacks on npm is published from that
      # commit's own tree. Otherwise the run releases the dispatched commit,
      # which must still be the tip of main so that the images, the recorded
      # revision, and npm's provenance all describe one tree.
      - name: Decide whether this run bumps or resumes a release
        id: plan
        env:
          START_NEW_VERSION: ${{ inputs.start_new_version }}
        run: |
          test -n "$IMAGE_REPOSITORY" || {
            echo "ERROR: the GCP_IMAGE_REPOSITORY repository variable is unset; copy the Terraform controller_repository output"
            exit 1
          }
          git fetch origin main --quiet
          RELEASE_LINE=$(git log origin/main --format='%H %s' | grep -m1 ' chore(release): moltzap@' || true)
          if [ -n "$RELEASE_LINE" ]; then
            RELEASE_COMMIT=${RELEASE_LINE%% *}
            VERSION=${RELEASE_LINE#* chore(release): moltzap@}
            [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
              echo "ERROR: release commit $RELEASE_COMMIT has an unreadable version '$VERSION'"
              exit 1
            }
            MISSING=""
            for pkg in $RELEASE_PACKAGES; do
              NAME=$(jq -r .name "packages/$pkg/package.json")
              STATUS=0
              scripts/release/npm-version-exists.sh "${NAME}@${VERSION}" || STATUS=$?
              case $STATUS in
                0) ;;
                1) MISSING="$MISSING $NAME" ;;
                *) exit "$STATUS" ;;
              esac
            done
            if [ -n "$MISSING" ] && [ "$START_NEW_VERSION" = "true" ]; then
              echo "Abandoning release $VERSION from $RELEASE_COMMIT; not yet on npm:$MISSING"
            elif [ -n "$MISSING" ]; then
              echo "Resuming release $VERSION from $RELEASE_COMMIT; not yet on npm:$MISSING"
              git checkout --quiet "$RELEASE_COMMIT"
              echo "mode=resume" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ] || {
            echo "ERROR: main moved past the dispatched commit $GITHUB_SHA; dispatch the release again from the tip"
            exit 1
          }
          # A version whose release commit and tag were pushed but whose
          # publish never completed is taken even though npm has never seen it.
          TAKEN_VERSIONS=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/v##')
          export TAKEN_VERSIONS
          VERSION=$(scripts/release/compute-next-version.sh $RELEASE_PACKAGES)
          echo "Next version: $VERSION"
          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: Write the version into every published manifest
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          for pkg in $RELEASE_PACKAGES; do
            jq --arg v "$VERSION" '.version = $v' "packages/$pkg/package.json" > tmp.json
            mv tmp.json "packages/$pkg/package.json"
          done
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm build

      # The four gates pack the five published packages and the NanoClaw
      # adapter, whose gate proves it still compiles against the Client ABI in
      # isolation (the image build copies its source, not a tarball); identity
      # and router travel in every closure, and each gate is a boundary-check
      # floor, so run-many
      # cannot silently skip one. Each gate spawns pnpm and the OpenClaw host,
      # so they run one at a time.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack --parallel=1

      - uses: google-github-actions/auth@v2
        if: steps.plan.outputs.mode == 'bump'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.plan.outputs.mode == 'bump'

      - name: Push the release images or reuse their existing digests
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gcloud auth configure-docker "${IMAGE_REPOSITORY%%/*}" --quiet
          # Docker builds are not byte-reproducible, so an earlier attempt's
          # image is reused rather than rebuilt. The attempt tag names the
          # version and the source revision, because the packed workspace
          # inside each image carries the stamped version: the same revision
          # released on a later day is a different image. The version tag is
          # then created or moved to that digest. Until the release commit is
          # on main the version tag is not authoritative, so a leftover from
          # an attempt on another revision is overwritten rather than trusted.
          # gcloud reports a missing tag or image name as "Image not found";
          # only that reads as empty. Any other failure, including a missing
          # repository, aborts, because "absent" is what would justify a
          # fresh push.
          tag_digest() {
            local output
            if output=$(gcloud artifacts docker images describe "$1" \
                --format='value(image_summary.digest)' 2>&1); then
              printf '%s' "$output"
            elif grep -q "Image not found" <<< "$output"; then
              printf ''
            else
              echo "ERROR: could not describe $1: $output" >&2
              return 1
            fi
          }
          resolve_or_build() {
            local name="$1" builder="$2" repository="$IMAGE_REPOSITORY/$1" digest
            local attempt_tag="$repository:$VERSION-$GITHUB_SHA" version_tag="$repository:$VERSION"
            digest=$(tag_digest "$attempt_tag")
            if [ -n "$digest" ]; then
              echo "reusing $attempt_tag@$digest" >&2
            else
              digest=$(node "$builder" --repository "$repository" --tag "$VERSION-$GITHUB_SHA" --push \
                | tail -1 | jq -r .imageDigest)
            fi
            gcloud artifacts docker tags add "$repository@$digest" "$version_tag" --quiet
            jq -n --arg name "$name" --arg repository "$repository" --arg digest "$digest" \
              '{name: $name, repository: $repository, digest: $digest}'
          }
          {
            resolve_or_build controller scripts/simulator/build-controller-image.mjs
            resolve_or_build openclaw-agent scripts/agent-images/build-openclaw-image.mjs
            resolve_or_build nanoclaw-agent scripts/agent-images/build-nanoclaw-image.mjs
          } | jq -s --arg version "$VERSION" --arg revision "$GITHUB_SHA" \
            '{version: $version, sourceRevision: $revision, images: .}' \
            > "$RUNNER_TEMP/published-images.json"
          cat "$RUNNER_TEMP/published-images.json"

      # The release App token is minted only now, scoped to contents, and
      # used for exactly one push.
      - uses: actions/create-github-app-token@v2
        if: steps.plan.outputs.mode == 'bump'
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The runner's pnpm install wired the husky hooks; the release commit
      # is made of generated output CI already gated, so the hooks stay out.
      - name: Record digests, regenerate docs, and commit the release
        if: steps.plan.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
          HUSKY: "0"
        run: |
          node scripts/release/write-published-images.mjs \
            --digests "$RUNNER_TEMP/published-images.json"
          pnpm docs:generate
          grep -qx '## \[Unreleased\]' CHANGELOG.md || { echo "CHANGELOG.md has no [Unreleased] section"; exit 1; }
          grep -q "^## \[$VERSION\]" CHANGELOG.md \
            || sed -i "s/^## \[Unreleased\]$/&\n\n## [$VERSION] - $(date -u +%F)/" CHANGELOG.md

          git config user.name "moltzap-release[bot]"
          git config user.email "moltzap-release[bot]@users.noreply.github.com"
          git add packages/*/package.json pnpm-lock.yaml CHANGELOG.md \
            packages/simulator/gke/README.md docs/ 'packages/**/MODULE.md' README.md
          git commit -m "chore(release): moltzap@$VERSION"
          git tag "v$VERSION"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)" \
            push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: Publish every package not yet on npm at this version
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "npm version: $(npm --version)"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
            echo "ERROR: GitHub OIDC token request env is missing; check id-token: write permissions"
            exit 1
          }
          # Every manifest is checked before the first publish, so a drifted
          # one cannot leave the set half-published.
          for pkg in $RELEASE_PACKAGES; do
            VER=$(jq -r .version "packages/$pkg/package.json")
            [ "$VER" = "$VERSION" ] || { echo "ERROR: packages/$pkg is at $VER, expected $VERSION"; exit 1; }
          done
          for pkg in $RELEASE_PACKAGES; do
            NAME=$(jq -r .name "packages/$pkg/package.json")
            VER=$VERSION
            STATUS=0
            scripts/release/npm-version-exists.sh "${NAME}@${VER}" || STATUS=$?
            if [ "$STATUS" -eq 0 ]; then
              echo "${NAME}@${VER} already on npm — skipping"
              continue
            fi
            [ "$STATUS" -eq 1 ] || exit "$STATUS"
            echo "Publishing ${NAME}@${VER}..."
            (
              cd "packages/$pkg"
              TARBALL=$(pnpm pack --pack-gzip-level 9 | tail -1)
              [ -f "$TARBALL" ] || { echo "ERROR: pack failed, tarball not found"; exit 1; }
              npm publish "$TARBALL" --access public --provenance
            )
          done
