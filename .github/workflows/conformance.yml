name: Conformance

on:
  push:
    branches: [main, v2, cutover/four-layer-v2]
  pull_request:
    paths:
      - "packages/protocol/**"
      - "packages/server/**"
      - "docker-compose.conformance.yml"
      - ".github/workflows/conformance.yml"

# Self-hosted Nx remote cache (Railway). Trusted events -- pushes to maintained branches and
# same-repo pull requests -- read and populate the shared cache. Fork PRs receive
# no repository secrets and a writable shared cache is a poisoning vector, so they
# skip the remote cache and run cold.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: https://nx-cache-server-production.up.railway.app
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  NX_SKIP_REMOTE_CACHE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'true' || 'false' }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOXIPROXY_URL: http://127.0.0.1:8474
      ARTIFACT_DIR: conformance-artifacts
      SKIP_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start Toxiproxy
        run: docker compose -f docker-compose.conformance.yml up -d

      - name: Wait for Toxiproxy
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8474/version; then exit 0; fi
            sleep 1
          done
          echo "Toxiproxy did not come up" >&2
          exit 1

      - name: Run server-side conformance suite
        run: pnpm -F @moltzap/server-core test:conformance

      - name: Stop Toxiproxy
        if: always()
        run: docker compose -f docker-compose.conformance.yml down -v

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-artifacts
          path: |
            packages/server/conformance-artifacts
          if-no-files-found: ignore
