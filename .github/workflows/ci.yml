name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-hosted Nx remote cache (cacheiro on Cloud Run). Every Nx job reads it
# with the repository secret NX_CACHE_TOKEN, a read-only token. A push to main
# binds the job to the `nx-cache-write` environment, limited to main, whose
# same-named secret is the write token. A pull request from a branch of this
# repository writes with the repository secret NX_CACHE_WRITE_TOKEN, outside
# the environment because its branch policy rejects pull request refs; without
# that secret the pull request falls back to the read-only token. Writing from
# pull requests lets main reuse the results a pull request already computed,
# at a cost: anyone who can push a branch here can write cache artifacts that
# a later main run restores instead of executing. Fork pull requests receive
# no secrets, so they skip the remote cache and run cold; the repository
# variable NX_CACHE_DISABLED=true skips it everywhere.

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      # The release commit writes CHANGELOG.md from the fragments in
      # changelog.d/, so a pull request adds a fragment instead of editing it.
      # HEAD is the pull request's merge commit, whose first parent is its
      # base; a base without towncrier.toml still takes hand-written entries.
      - name: Refuse CHANGELOG.md edits
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --quiet --depth=2 origin "$GITHUB_SHA"
          if git cat-file -e HEAD^1:towncrier.toml 2>/dev/null \
            && ! git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::This pull request edits CHANGELOG.md; add a fragment under changelog.d/ instead (see towncrier.toml)"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify pnpm-lock.yaml matches package.json and the catalog
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm build
      # The gates pack the four published packages and the NanoClaw adapter,
      # whose gate proves it still compiles against the Client ABI in isolation
      # (deployment's image build copies its source, not a tarball); identity and router
      # travel in every closure, and each gate is a boundary-check floor, so
      # run-many cannot silently skip one; the gates spawn pnpm and the
      # OpenClaw host, so they run one at a time.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack --parallel=1
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
        timeout-minutes: 30
      # `pnpm build` and `pnpm lint` already run every project's build, lint,
      # and arch:check; this step pins the resolved graph itself: every
      # project, root, edge, and package-specific target. Tests run in the
      # `test` job.
      - name: Verify the Nx project graph
        run: |
          pnpm nx graph --print > "${RUNNER_TEMP}/moltzap-project-graph.json"
          node scripts/architecture/check-boundaries.js --nx-graph "${RUNNER_TEMP}/moltzap-project-graph.json"
      - run: pnpm format:check
      - run: pnpm docs:check:drift
      - run: pnpm docs:check
      - run: pnpm docs:check:mermaid
      - run: pnpm docs:check:gates-test
      - run: pnpm test:compute-next-version
      - run: pnpm test:npm-version-exists

  test:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && secrets.NX_CACHE_WRITE_TOKEN || secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'true' || 'false' }}
    steps:
      # A pull request runs only the projects its diff affects, against the PR
      # base that nx-set-shas resolves; fetch-depth: 0 gives it that history.
      # A push to main runs every project. Each target builds what it needs
      # through dependsOn, so there is no separate build step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: Test the affected projects
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t typecheck:tests test test:integration
      - name: Test every project
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t typecheck:tests test test:integration
