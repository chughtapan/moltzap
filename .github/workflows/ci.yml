name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nx Cloud remote cache: CI authenticates with a read-only access token, so
# `nx run-many`/`affected` reuse cached task outputs across runs. Read-only means
# CI reads but never writes the cache; local read-write builds populate it.
env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm docs:check:drift

  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + nx-set-shas give `nx affected` the base/head SHAs to
      # diff against (PR base on pull_request, last successful run on push), so
      # only changed projects + their dependents run. `nx affected -t test`
      # builds the affected chain via dependsOn ^build — no separate build step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm exec nx affected -t typecheck:tests test test:integration
