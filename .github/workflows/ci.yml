name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-hosted Nx remote cache (Railway). Trusted events -- pushes to maintained branches and
# same-repo pull requests -- read and populate the shared cache. Fork PRs receive
# no repository secrets and a writable shared cache is a poisoning vector, so they
# skip the remote cache and run cold.
env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: https://nx-cache-server-production.up.railway.app
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
  NX_SKIP_REMOTE_CACHE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'true' || 'false' }}
  # The blind review gate resolves against the brain, and provenance
  # verification will once check-shape.ts stops reading the filesystem. Fork PRs
  # receive no secrets; that is accepted rather than degraded, because a check
  # that silently skips is the failure mode it exists to prevent.
  GBRAIN_DATABASE_URL: ${{ secrets.GBRAIN_DATABASE_URL }}

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Both Terraform checks pin the same Google provider; one plugin cache
      # downloads it once per run instead of once per module.
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The four gates pack all six published packages (identity and router
      # travel in every closure) and each gate is a boundary-check floor, so
      # run-many cannot silently skip one; the gates spawn pnpm and the
      # OpenClaw host, so they run one at a time.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack --parallel=1
      - name: Verify simulator infrastructure profiles
        run: |
          pnpm nx run @moltzap/simulator:local-profile-check
          pnpm nx run @moltzap/simulator:gke-profile-check
          pnpm nx run @moltzap/simulator:gke-terraform-check
      - name: Verify Phoenix infrastructure module
        run: pnpm nx run @moltzap/evals:phoenix-terraform-check
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
        timeout-minutes: 30
      # The graph check pins every project, edge, root, and package-specific
      # target. Exact runs execute the common package floor, with unit-test
      # targets only where a package owns a unit-test surface.
      - name: Verify seven-product Nx graph and target floor
        run: |
          pnpm nx graph --print > "${RUNNER_TEMP}/moltzap-project-graph.json"
          node scripts/architecture/check-boundaries.js --nx-graph "${RUNNER_TEMP}/moltzap-project-graph.json"
          for project in @moltzap/identity @moltzap/router @moltzap/client @moltzap/openclaw-channel @moltzap/nanoclaw-channel @moltzap/simulator @moltzap/evals; do
            for target in build lint arch:check; do
              pnpm nx run "${project}:${target}"
            done
          done
          for project in @moltzap/identity @moltzap/router @moltzap/client @moltzap/openclaw-channel @moltzap/simulator @moltzap/evals; do
            for target in typecheck:tests test; do
              pnpm nx run "${project}:${target}"
            done
          done
          for project in @moltzap/identity @moltzap/router; do
            pnpm nx run "${project}:typecheck"
          done
          for project in @moltzap/identity @moltzap/router @moltzap/client; do
            pnpm nx run "${project}:test:integration"
          done
          pnpm nx run workspace:test:integration
      - run: pnpm format:check
      - run: pnpm docs:check:drift
      - run: pnpm docs:check
      - run: pnpm docs:check:mermaid
      - run: pnpm docs:check:gates-test
      - run: pnpm test:compute-next-version
      - run: pnpm test:npm-version-exists
      - run: pnpm test:write-published-images

  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 + nx-set-shas give `nx affected` the base/head SHAs to
      # diff against (PR base on pull_request, last successful run on push), so
      # only changed projects + their dependents run. `nx affected -t test`
      # builds the affected chain via dependsOn ^build — no separate build step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm exec nx affected -t typecheck:tests test test:integration
