name: CI

on:
  push:
    branches: [main]
  pull_request:

# Self-hosted Nx remote cache (cacheiro on Cloud Run). Every Nx job reads it
# with the repository secret NX_CACHE_TOKEN, a read-only token. A push to main
# binds the job to the `nx-cache-write` environment, limited to main, whose
# same-named secret is the write token, so only main populates the cache. Fork
# pull requests receive no secrets, so they skip the remote cache and run cold;
# the repository variable NX_CACHE_DISABLED=true skips it everywhere.

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Verify pnpm-lock.yaml matches package.json and the catalog
        run: |
          pnpm install --lockfile-only --ignore-scripts
          git diff --exit-code pnpm-lock.yaml
      - run: pnpm build
      # The gates pack the four published packages and the NanoClaw adapter,
      # whose gate proves it still compiles against the Client ABI in isolation
      # (the image build copies its source, not a tarball); identity and router
      # travel in every closure, and each gate is a boundary-check floor, so
      # run-many cannot silently skip one; the gates spawn pnpm and the
      # OpenClaw host, so they run one at a time.
      - name: Verify the published closure installs from tarballs
        run: pnpm nx run-many -t test:pack --parallel=1
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
        timeout-minutes: 30
      # The graph check pins every project, edge, root, and package-specific
      # target. Exact runs execute the common package floor, with unit-test
      # targets only where a package owns a unit-test surface.
      - name: Verify five-product Nx graph and target floor
        run: |
          pnpm nx graph --print > "${RUNNER_TEMP}/moltzap-project-graph.json"
          node scripts/architecture/check-boundaries.js --nx-graph "${RUNNER_TEMP}/moltzap-project-graph.json"
          for project in @moltzap/identity @moltzap/router @moltzap/client @moltzap/openclaw-channel @moltzap/nanoclaw-channel; do
            for target in build lint arch:check; do
              pnpm nx run "${project}:${target}"
            done
          done
          for project in @moltzap/identity @moltzap/router @moltzap/client @moltzap/openclaw-channel; do
            for target in typecheck:tests test; do
              pnpm nx run "${project}:${target}"
            done
          done
          for project in @moltzap/identity @moltzap/router; do
            pnpm nx run "${project}:typecheck"
          done
          for project in @moltzap/identity @moltzap/router @moltzap/client; do
            pnpm nx run "${project}:test:integration"
          done
          pnpm nx run workspace:test:integration
      - run: pnpm format:check
      - run: pnpm docs:check:drift
      - run: pnpm docs:check
      - run: pnpm docs:check:mermaid
      - run: pnpm docs:check:gates-test
      - run: pnpm test:compute-next-version
      - run: pnpm test:npm-version-exists

  test:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nx-cache-write' || '' }}
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ vars.NX_CACHE_URL }}
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_CACHE_TOKEN }}
      NX_SKIP_REMOTE_CACHE: ${{ (vars.NX_CACHE_DISABLED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'true' || 'false' }}
    steps:
      # fetch-depth: 0 + nx-set-shas give `nx affected` the base/head SHAs to
      # diff against (PR base on pull_request, last successful run on push), so
      # only changed projects + their dependents run. `nx affected -t test`
      # builds the affected chain via dependsOn ^build — no separate build step.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - run: pnpm exec nx affected -t typecheck:tests test test:integration
