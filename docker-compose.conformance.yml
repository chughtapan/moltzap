services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: moltzap-conformance-toxiproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:47000-47099:47000-47099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["-host", "0.0.0.0", "-port", "8474"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8474/version"]
      interval: 2s
      timeout: 1s
      retries: 15
