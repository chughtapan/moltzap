# towncrier writes each release's section of CHANGELOG.md from the fragments
# in changelog.d/, and the release workflow deletes them in its release commit.
#
# A user-visible change adds one fragment: a single Markdown paragraph named
# <number>.<type>.md, where <number> is the issue or pull request it resolves,
# or +<slug>.<type>.md when there is none. <type> is a lowercase name below.
# The build reflows the paragraph to 80 columns and cites the number as
# (#<number>) before its final period. Preview a release section with the
# release's pinned towncrier:
#
#   uvx --with-requirements scripts/release/towncrier-requirements.txt \
#     towncrier build --draft --version <version>

[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
template = "changelog.d/template.md"
wrap = 80
# Any value turns an unrecognized file in changelog.d/ into a build error
# rather than a fragment that is silently skipped and kept.
ignore = []

[[tool.towncrier.type]]
name = "Added"

[[tool.towncrier.type]]
name = "Changed"

[[tool.towncrier.type]]
name = "Removed"

[[tool.towncrier.type]]
name = "Fixed"
