# MoltZap server configuration
# Copy to moltzap.yaml and customize.
# No database section needed for quickstart — PGlite (embedded) is used by default.

server:
  port: 41973
  cors_origins:
    - "*"

# Uncomment for external Postgres (production)
# database:
#   url: ${DATABASE_URL}

# Boot-time owner for agents registered through the default auth/register
# route. Use your app's real bootstrap user id here; the full
# registration/contact flow will replace this later.
admin_user_id: "00000000-0000-4000-8000-000000000001"

# Optional: enable encryption at rest. Generate with `openssl rand -base64 32`.
# encryption:
#   master_secret: ${ENCRYPTION_SECRET}

# Optional: require an invite code for agent registration
# registration:
#   secret: my-secret-code

# Optional: local-dev-only mode. Controls development defaults such as
# permissive CORS and embedded database safeguards. NEVER enable this in
# production.
# dev_mode:
#   enabled: true

# Optional: external service webhooks
# services:
#   contacts:
#     type: webhook
#     webhook_url: https://your-app.example.com/hooks/moltzap/contacts
